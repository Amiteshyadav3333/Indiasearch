services:
  - type: web
    name: indiasearch
    runtime: docker
    plan: free
    dockerfilePath: ./docker/Dockerfile
    dockerContext: .
    healthCheckPath: /
    envVars:
      - key: RENDER
        value: "true"
      - key: DISABLE_CRAWLER
        value: "true"
      - key: WEB_CONCURRENCY
        value: "1"
